
<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f9f8">
<meta name="description" content="SAVVYEX — Personal Finance Assistant">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="512x512" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<title>SAVVYEX</title>
<style>
:root{--bg:#f5f9f8;--card:#fff;--ink:#19332f;--muted:#71827e;--teal:#159e91;--soft:#e2f4f1;--line:#e5eeeb;--navy:#1d3935;--red:#c75f5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:86px}
header{padding:22px 19px 14px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:11px;letter-spacing:2.5px;color:var(--teal);font-weight:900}
.title{font-size:25px;font-weight:850;margin-top:7px;letter-spacing:-.7px}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--teal);font-weight:900;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:contain;display:block}
main{padding:0 17px;max-width:620px;margin:auto}
.hero{background:var(--navy);color:white;padding:20px;border-radius:20px;margin:7px 0 20px}
.eyebrow{font-size:10px;letter-spacing:1.2px;font-weight:800;color:#b6dad4}
.heroVal{font-size:34px;font-weight:900;margin:12px 0}
.stats{display:flex;justify-content:space-between;border-top:1px solid #45615d;padding-top:13px}
.stats small{display:block;color:#c5dcd7;font-size:11px}
.stats b{display:block;margin-top:5px;font-size:14px}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.section h2{font-size:16px;margin:0}
.link{color:var(--teal);font-size:12px;font-weight:800;border:0;background:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rowmain{flex:1;min-width:0}
.item{font-size:13px;font-weight:750}
.meta{font-size:10px;color:var(--muted);margin-top:4px}
.amt{font-size:12px;font-weight:850}
.positive{color:var(--teal)}
.negative{color:var(--red)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{border:1px solid var(--line);background:white;border-radius:15px;padding:15px;text-align:left;color:var(--ink);font-weight:750}
.quick strong{display:block;color:var(--teal);font-size:22px;margin-bottom:7px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#f8fbfa;color:var(--ink);font-size:14px;margin:5px 0;outline:none}
button.primary{width:100%;border:0;border-radius:11px;padding:13px;background:var(--teal);color:white;font-weight:850;margin-top:7px}
button.secondary{width:100%;border:0;border-radius:11px;padding:12px;background:var(--soft);color:var(--teal);font-weight:800;margin-top:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}
.pill{border:1px solid var(--line);background:#f7faf9;padding:8px 10px;border-radius:20px;font-size:11px;color:var(--muted)}
.pill.active{background:var(--soft);color:var(--teal);border-color:#c7e8e2}
.progress{height:7px;background:#edf2f0;border-radius:9px;overflow:hidden;margin:12px 0}
.fill{height:100%;background:var(--teal);border-radius:9px}
.nav{position:fixed;bottom:0;left:0;right:0;height:72px;padding:6px 4px max(7px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);z-index:4}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8c9b97;font-size:9px;font-weight:650;flex:1}
.nav button.active{color:var(--teal)}
.nav .ico{font-size:19px}
.fab{position:fixed;right:18px;bottom:88px;border:0;background:var(--teal);color:white;border-radius:25px;padding:12px 16px;font-weight:850;box-shadow:0 5px 20px #159e9133;z-index:3}
.notice,.disclaimer{background:var(--soft);color:var(--navy);padding:11px;border-radius:12px;font-size:10px;line-height:1.5;margin:8px 0 12px}
.disclaimer{text-align:center;background:#eef4f2;color:var(--muted)}
.chat{height:48vh;overflow:auto}
.bubble{max-width:88%;padding:12px;border-radius:15px;margin:9px 0;font-size:12px;line-height:1.5;background:#fff;border:1px solid var(--line)}
.bubble.user{margin-left:auto;background:var(--teal);color:#fff;border:0}
.hidden{display:none!important}
.center{text-align:center}
.big{font-size:27px;font-weight:900}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
<div>
<div class="brand">SAVVYEX</div>
<div class="title" id="headTitle">Τα οικονομικά σου.</div>
<div class="sub" id="headSub">Μια πιο καθαρή εικόνα, κάθε μέρα.</div>
</div>
<div class="avatar"><img src="./icon.png" alt="SAVVYEX logo"></div>
</header>
<main id="app"></main>
<nav class="nav" id="nav">
<button data-tab="home" class="active"><span class="ico">⌂</span>Αρχική</button>
<button data-tab="moves"><span class="ico">↕</span>Κινήσεις</button>
<button data-tab="subs"><span class="ico">▤</span>Συνδρομές</button>
<button data-tab="goals"><span class="ico">◎</span>Στόχοι</button>
<button data-tab="account"><span class="ico">◯</span>Προφίλ</button>
</nav>
<button class="fab" id="aiFab">✦ AI</button>

<script>
const KEY='savvyex.pwa.v1';

const sample={
income:[{id:'i1',title:'Μισθός',category:'Εργασία',amount:1500,date:'Δείγμα'}],
expenses:[
{id:'e1',title:'Supermarket',category:'Τρόφιμα',amount:64.8,date:'Δείγμα'},
{id:'e2',title:'Ρεύμα',category:'Λογαριασμοί',amount:92,date:'Δείγμα'},
{id:'e3',title:'Καφές',category:'Καθημερινά',amount:4.5,date:'Δείγμα'}
],
subscriptions:[
{id:'s1',title:'Streaming',amount:9.99,cycle:'Μηνιαία'},
{id:'s2',title:'Μουσική',amount:6.99,cycle:'Μηνιαία'}
],
goals:[
{id:'g1',title:'Ταμείο έκτακτης ανάγκης',target:3000,saved:500},
{id:'g2',title:'Διακοπές',target:1200,saved:250}
]
};

let data;
try{
data=JSON.parse(localStorage.getItem(KEY))||sample;
}catch{
data=sample;
}

let tab='home';
let category='Τρόφιμα';
let kind='expense';

let chatMessages=[{
role:'ai',
text:'Γεια σου! Είμαι ο SAVVYEX Assistant. Μπορώ να σε βοηθήσω να οργανώσεις τα οικονομικά σου. Τι θα ήθελες να εξετάσουμε;'
}];

const money=n=>new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const sum=a=>a.reduce((s,x)=>s+Number(x.amount||0),0);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const $=id=>document.getElementById(id);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function header(title,sub){
$('headTitle').textContent=title;
$('headSub').textContent=sub;
}

function card(s){
return `<section class="card">${s}</section>`;
}

function section(t,link=''){
return `<div class="section"><h2>${t}</h2>${link?`<button class="link" onclick="go('${link}')">Προβολή</button>`:''}</div>`;
}

function row(x,type){
return `<div class="row">
<div class="rowmain">
<div class="item">${esc(x.title)}</div>
<div class="meta">${esc(x.category||x.cycle||'')} · ${esc(x.date||'')}</div>
</div>
<div class="amt ${type==='income'?'positive':''}">${type==='income'?'+':'−'}${money(x.amount)}</div>
</div>`;
}

function render(){
const inc=sum(data.income);
const exp=sum(data.expenses);
const subs=sum(data.subscriptions);

$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
$('aiFab').classList.toggle('hidden',tab==='ai');

if(tab==='home'){
header('Τα οικονομικά σου.','Μια πιο καθαρή εικόνα, κάθε μέρα.');

$('app').innerHTML=`
<div class="hero">
<div class="eyebrow">ΕΚΤΙΜΩΜΕΝΟ ΥΠΟΛΟΙΠΟ · ΔΕΙΓΜΑ</div>
<div class="heroVal">${money(inc-exp)}</div>
<div class="stats">
<div><small>Έσοδα</small><b>${money(inc)}</b></div>
<div><small>Έξοδα</small><b>${money(exp)}</b></div>
</div>
</div>
<div class="quick">
<button onclick="go('moves')"><strong>＋</strong>Νέα κίνηση</button>
<button onclick="go('goals')"><strong>◎</strong>Νέος στόχος</button>
</div>
${section('Πρόσφατες κινήσεις','moves')}
${card([...data.income.map(x=>({...x,type:'income'})),...data.expenses.map(x=>({...x,type:'expense'}))].slice(0,5).map(x=>row(x,x.type)).join('')||'<div class="empty">Δεν υπάρχουν κινήσεις ακόμη.</div>')}
${section('Συνδρομές','subs')}
${card(`<div class="item">Μηνιαίο σύνολο</div><div class="big">${money(subs)}</div><div class="meta">${data.subscriptions.length} καταχωρήσεις</div>`)}
<div class="disclaimer">Πρωτότυπο MVP · Τα αρχικά στοιχεία είναι ενδεικτικά. Μπορείς να τα διαγράψεις από το Προφίλ.</div>`;
}
else if(tab==='moves'){
header('Κινήσεις','Καταχώρησε τα έσοδα και τα έξοδά σου.');

$('app').innerHTML=`
${card(`
<div class="eyebrow">ΝΕΑ ΚΑΤΑΧΩΡΗΣΗ</div>
<div class="pills">
<button class="pill ${kind==='expense'?'active':''}" onclick="setKind('expense')">Έξοδο</button>
<button class="pill ${kind==='income'?'active':''}" onclick="setKind('income')">Έσοδο</button>
</div>
<input id="moveTitle" placeholder="Περιγραφή">
<input id="moveAmount" inputmode="decimal" placeholder="Ποσό (€)">
<div class="pills" id="cats">
${(kind==='income'?['Εργασία','Επιχείρηση','Επένδυση','Άλλο']:['Τρόφιμα','Λογαριασμοί','Μεταφορές','Καθημερινά','Υγεία','Άλλο']).map(c=>`<button class="pill ${category===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
</div>
<button class="primary" onclick="addMove()">Αποθήκευση</button>
`)}
${section('Έξοδα')}
${card(data.expenses.map(x=>row(x,'expense')).join('')||'<div class="empty">Δεν υπάρχουν έξοδα.</div>')}
${section('Έσοδα')}
${card(data.income.map(x=>row(x,'income')).join('')||'<div class="empty">Δεν υπάρχουν έσοδα.</div>')}`;
}
else if(tab==='subs'){
header('Συνδρομές','Παρακολούθησε τις επαναλαμβανόμενες χρεώσεις.');

$('app').innerHTML=`
<div class="hero">
<div class="eyebrow">ΣΥΝΟΛΟ ΚΑΤΑΧΩΡΗΣΕΩΝ</div>
<div class="heroVal">${money(subs)}</div>
<div class="heroSmall">Μηνιαίο άθροισμα ενδεικτικών ποσών</div>
</div>
${card(`
<div class="eyebrow">ΠΡΟΣΘΗΚΗ ΣΥΝΔΡΟΜΗΣ</div>
<input id="subTitle" placeholder="Όνομα συνδρομής">
<input id="subAmount" inputmode="decimal" placeholder="Ποσό (€)">
<select id="subCycle">
<option>Μηνιαία</option>
<option>Ετήσια</option>
</select>
<button class="primary" onclick="addSub()">Προσθήκη</button>
`)}
${card(data.subscriptions.map(x=>row({...x,category:x.cycle},'expense')).join('')||'<div class="empty">Δεν υπάρχουν συνδρομές.</div>')}`;
}
else if(tab==='goals'){
header('Στόχοι','Δώσε κατεύθυνση στην αποταμίευσή σου.');

$('app').innerHTML=`
${card(`
<div class="eyebrow">ΔΗΜΙΟΥΡΓΙΑ ΣΤΟΧΟΥ</div>
<input id="goalTitle" placeholder="π.χ. Ταμείο έκτακτης ανάγκης">
<input id="goalTarget" inputmode="decimal" placeholder="Στόχος (€)">
<button class="primary" onclick="addGoal()">Δημιουργία στόχου</button>
`)}
${data.goals.map(g=>card(`
<div class="item">${esc(g.title)}</div>
<div class="big">${Math.round(g.saved/g.target*100)}%</div>
<div class="progress"><div class="fill" style="width:${Math.min(100,g.saved/g.target*100)}%"></div></div>
<div class="meta">${money(g.saved)} από ${money(g.target)}</div>
<button class="secondary" onclick="progressGoal('${g.id}')">＋ Προσθήκη ${money(20)}</button>
`)).join('')||'<div class="empty">Δεν υπάρχουν στόχοι ακόμη.</div>'}`;
}
else if(tab==='ai'){
header('AI Assistant','Ο προσωπικός σου βοηθός οικονομικής οργάνωσης.');

$('app').innerHTML=`
<div class="notice">Προεπισκόπηση: οι απαντήσεις είναι ενδεικτικές και όχι πραγματική σύνδεση AI. Δεν παρέχεται επενδυτική ή φορολογική συμβουλή.</div>
<div class="chat" id="chat">
${chatMessages.map(m=>`<div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}
</div>
<div style="display:flex;gap:7px">
<input id="chatInput" placeholder="Ρώτησε για τα οικονομικά σου...">
<button class="primary" style="width:56px;margin:5px 0" onclick="sendChat()">↑</button>
</div>`;
$('chat').scrollTop=$('chat').scrollHeight;
}
else{
header('Το προφίλ σου','Οι ρυθμίσεις της SAVVYEX.');

$('app').innerHTML=`
${card('<div class="center"><div class="avatar" style="margin:auto;width:58px;height:58px"><img src="./icon.png" alt="SAVVYEX logo"></div><h3>Καλώς ήρθες στη SAVVYEX</h3><div class="meta">Προσωπικός οικονομικός χώρος</div></div>')}
${card(`
<div class="item">Αποθήκευση δεδομένων</div>
<div class="meta">Οι καταχωρήσεις αποθηκεύονται τοπικά σε αυτή τη συσκευή και σε αυτόν τον browser.</div>
<button class="secondary" onclick="resetData()">Επαναφορά ενδεικτικών δεδομένων</button>
<button class="primary" style="background:#c75f5f" onclick="clearData()">Διαγραφή όλων των δεδομένων</button>
`)}
<div class="disclaimer">Η SAVVYEX δεν συνδέεται με τράπεζες σε αυτή την έκδοση. Μην καταχωρείς κωδικούς τραπεζών ή άλλα ευαίσθητα στοιχεία.</div>`;
}
}

function go(t){
tab=t;
render();
window.scrollTo(0,0);
}

function setKind(k){
kind=k;
category=k==='income'?'Εργασία':'Τρόφιμα';
render();
}

function setCat(c){
category=c;
render();
}

function val(id){
return $(id)?.value?.trim()||'';
}

function num(id){
return Number(val(id).replace(',','.'));
}

function valid(t,n){
if(!t||!Number.isFinite(n)||n<=0){
alert('Συμπλήρωσε περιγραφή και έγκυρο ποσό.');
return false;
}
return true;
}

function addMove(){
let t=val('moveTitle'),n=num('moveAmount');
if(!valid(t,n))return;
data[kind==='income'?'income':'expenses'].unshift({
id:crypto.randomUUID(),
title:t,
amount:n,
category,
date:new Date().toLocaleDateString('el-GR')
});
save();
render();
}

function addSub(){
let t=val('subTitle'),n=num('subAmount');
if(!valid(t,n))return;
data.subscriptions.unshift({
id:crypto.randomUUID(),
title:t,
amount:n,
cycle:$('subCycle').value
});
save();
render();
}

function addGoal(){
let t=val('goalTitle'),n=num('goalTarget');
if(!valid(t,n))return;
data.goals.unshift({id:crypto.randomUUID(),title:t,target:n,saved:0});
save();
render();
}

function progressGoal(id){
let g=data.goals.find(x=>x.id===id);
g.saved=Math.min(g.target,g.saved+20);
save();
render();
}

function resetData(){
if(confirm('Να επαναφέρουμε τα ενδεικτικά δεδομένα?')){
data=JSON.parse(JSON.stringify(sample));
save();
render();
}
}

function clearData(){
if(confirm('Να διαγραφούν όλες οι καταχωρήσεις;')){
data={income:[],expenses:[],subscriptions:[],goals:[]};
save();
render();
}
}

function sendChat(){
let q=val('chatInput');
if(!q)return;
chatMessages.push(
{role:'user',text:q},
{role:'ai',text:'Αυτή είναι η δοκιμαστική έκδοση του SAVVYEX Assistant. Για πραγματικές εξατομικευμένες απαντήσεις θα συνδεθεί αργότερα με ασφαλή υπηρεσία AI. Προς το παρόν, μπορείς να εξετάσεις τις κατηγορίες εξόδων και τις συνδρομές σου για πιθανές ευκαιρίες εξοικονόμησης.'}
);
render();
}

$('nav').addEventListener('click',e=>{
let b=e.target.closest('button[data-tab]');
if(b)go(b.dataset.tab);
});

$('aiFab').onclick=()=>go('ai');

if('serviceWorker'in navigator){
window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
}

render();
</script>
</body>
</html>
