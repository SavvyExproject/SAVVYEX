
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f9f8">
<meta name="description" content="SAVVYEX Personal Finance">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<title>SAVVYEX</title>

<style>
:root{
--bg:#f5f9f8;--card:#fff;--ink:#19332f;
--muted:#71827e;--teal:#159e91;
--soft:#e2f4f1;--line:#e5eeeb;
--navy:#1d3935;--red:#c75f5f
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:Inter,system-ui,sans-serif;padding-bottom:85px}
header{padding:22px 19px 14px;display:flex;
justify-content:space-between;align-items:center}
.brand{font-size:11px;letter-spacing:2.5px;color:var(--teal);font-weight:900}
.title{font-size:25px;font-weight:850;margin-top:7px}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.avatar{width:42px;height:42px;border-radius:50%;
background:var(--soft);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:contain}
main{padding:0 17px;max-width:620px;margin:auto}
.card{background:white;border:1px solid var(--line);
border-radius:17px;padding:17px;margin-bottom:13px}
.hero{background:var(--navy);color:white;padding:20px;
border-radius:20px;margin:7px 0 20px}
.eyebrow{font-size:10px;letter-spacing:1.2px;
font-weight:800;color:#b6dad4}
.heroVal{font-size:34px;font-weight:900;margin:12px 0}
.stats{display:flex;justify-content:space-between;
border-top:1px solid #45615d;padding-top:13px}
.stats small{display:block;color:#c5dcd7;font-size:11px}
.stats b{display:block;margin-top:5px;font-size:14px}
.section{display:flex;justify-content:space-between;
align-items:center;margin:20px 2px 10px}
.section h2{font-size:16px;margin:0}
.row{display:flex;align-items:center;gap:10px;
padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rowmain{flex:1;min-width:0}
.item{font-size:13px;font-weight:750}
.meta{font-size:10px;color:var(--muted);margin-top:4px}
.amt{font-size:12px;font-weight:850}
.positive{color:var(--teal)}
.negative{color:var(--red)}
input,select{width:100%;padding:13px;
border:1px solid var(--line);border-radius:11px;
background:#f8fbfa;color:var(--ink);
font-size:14px;margin:6px 0;outline:none}
button{cursor:pointer;font-family:inherit}
.primary{width:100%;border:0;border-radius:11px;
padding:13px;background:var(--teal);
color:white;font-weight:850;margin-top:8px}
.secondary{width:100%;border:0;border-radius:11px;
padding:12px;background:var(--soft);
color:var(--teal);font-weight:800;margin-top:8px}
.danger{background:#c75f5f;color:white}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{border:1px solid var(--line);background:#f7faf9;
padding:8px 10px;border-radius:20px;font-size:11px;color:var(--muted)}
.pill.active{background:var(--soft);color:var(--teal)}
.progress{height:7px;background:#edf2f0;
border-radius:9px;overflow:hidden;margin:12px 0}
.fill{height:100%;background:var(--teal)}
.nav{position:fixed;bottom:0;left:0;right:0;height:72px;
display:flex;justify-content:space-around;
background:white;border-top:1px solid var(--line);z-index:4}
.nav button{border:0;background:none;display:flex;
flex-direction:column;align-items:center;
justify-content:center;gap:4px;color:#8c9b97;
font-size:9px;flex:1}
.nav button.active{color:var(--teal)}
.ico{font-size:19px}
.fab{position:fixed;right:18px;bottom:88px;
border:0;background:var(--teal);color:white;
border-radius:25px;padding:12px 16px;z-index:3}
.notice{background:var(--soft);padding:12px;
border-radius:12px;font-size:11px;line-height:1.5;margin:10px 0}
.disclaimer{text-align:center;background:#eef4f2;
color:var(--muted);padding:12px;border-radius:12px;
font-size:10px;line-height:1.5;margin:12px 0}
.empty{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.hidden{display:none!important}
.center{text-align:center}
.big{font-size:27px;font-weight:900}
.auth{max-width:440px;margin:30px auto}
.auth h2{font-size:23px}
.auth p{font-size:12px;color:var(--muted);line-height:1.6}
.status{font-size:12px;margin:10px 0;color:var(--teal);line-height:1.5}
</style>
</head>

<body>

<header id="appHeader" class="hidden">
<div>
<div class="brand">SAVVYEX</div>
<div class="title" id="headTitle">Τα οικονομικά σου.</div>
<div class="sub" id="headSub">Μια πιο καθαρή εικόνα, κάθε μέρα.</div>
</div>
<div class="avatar"><img src="./icon.png" alt="SAVVYEX"></div>
</header>

<main id="app"></main>

<nav class="nav hidden" id="nav">
<button data-tab="home" class="active"><span class="ico">⌂</span>Αρχική</button>
<button data-tab="moves"><span class="ico">↕</span>Κινήσεις</button>
<button data-tab="subs"><span class="ico">▤</span>Συνδρομές</button>
<button data-tab="goals"><span class="ico">◎</span>Στόχοι</button>
<button data-tab="account"><span class="ico">◯</span>Προφίλ</button>
</nav>

<button class="fab hidden" id="aiFab">✦ AI</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =================================
   SAVVYEX SUPABASE CONFIGURATION
================================= */

const SUPABASE_URL =
'https://hojhpujeyudlzjchuvev.supabase.co';

const SUPABASE_KEY =
'sb_publishable_7NNstwDd3coLglr3Tu5eJQ_Mtk_33oc';

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* =================================
   APPLICATION STATE
================================= */

let user = null;
let tab = 'home';
let kind = 'expense';
let category = 'Τρόφιμα';
let loading = false;

let data = {
income:[],
expenses:[],
subscriptions:[],
goals:[]
};

let chatMessages = [
{text:'Γεια σου! Είμαι ο SAVVYEX Assistant. Πώς μπορώ να σε βοηθήσω;'}
];

const $ = id => document.getElementById(id);

const money = n =>
new Intl.NumberFormat('el-GR',{
style:'currency',currency:'EUR'
}).format(Number(n || 0));

const sum = arr =>
arr.reduce((s,x)=>s+Number(x.amount || 0),0);

const esc = s =>
String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));

function header(title,sub){
$('headTitle').textContent=title;
$('headSub').textContent=sub;
}

function message(text){
$('status') && ($('status').textContent=text);
alert(text);
}

/* =================================
   AUTHENTICATION
================================= */

function showAuth(){
$('appHeader').classList.add('hidden');
$('nav').classList.add('hidden');
$('aiFab').classList.add('hidden');

$('app').innerHTML=`
<div class="auth">
<div class="center">
<div class="avatar" style="width:75px;height:75px;margin:auto">
<img src="./icon.png" alt="SAVVYEX">
</div>
<div class="brand" style="margin-top:15px">SAVVYEX</div>
<h2>Τα οικονομικά σου, πιο έξυπνα.</h2>
<p>Δημιούργησε τον προσωπικό σου λογαριασμό.</p>
</div>

${card(`
<div class="pills">
<button class="pill active" id="loginTab" onclick="authMode('login')">Σύνδεση</button>
<button class="pill" id="signupTab" onclick="authMode('signup')">Εγγραφή</button>
</div>

<div id="authFields">
<input id="authEmail" type="email" placeholder="Email" autocomplete="email">
<input id="authPassword" type="password" placeholder="Κωδικός πρόσβασης" autocomplete="current-password">
</div>

<button class="primary" id="authButton" onclick="authenticate()">Σύνδεση</button>
<button class="secondary" onclick="forgotPassword()">Ξέχασα τον κωδικό μου</button>
<div class="status" id="status"></div>
`)}

<div class="disclaimer">
Τα οικονομικά σου δεδομένα αποθηκεύονται στον προσωπικό σου λογαριασμό.
</div>
</div>`;

window.authMode('login');
}

function card(content){
return `<section class="card">${content}</section>`;
}

window.authMode = function(mode){
const signup = mode==='signup';

$('loginTab').classList.toggle('active',!signup);
$('signupTab').classList.toggle('active',signup);

$('authButton').textContent =
signup ? 'Δημιουργία λογαριασμού' : 'Σύνδεση';

$('authButton').dataset.mode=mode;

$('authPassword').autocomplete =
signup?'new-password':'current-password';
};

async function authenticate(){
const email=$('authEmail').value.trim();
const password=$('authPassword').value;
const mode=$('authButton').dataset.mode;

if(!email || !password){
alert('Συμπλήρωσε email και κωδικό.');
return;
}

if(password.length<8){
alert('Ο κωδικός πρέπει να έχει τουλάχιστον 8 χαρακτήρες.');
return;
}

$('authButton').disabled=true;
$('authButton').textContent='Παρακαλώ περίμενε...';

try{
let result;

if(mode==='signup'){
result=await db.auth.signUp({
email,password,
options:{
emailRedirectTo:
'https://savvyexproject.github.io/SAVVYEX/'
}
});
}else{
result=await db.auth.signInWithPassword({
email,password
});
}

if(result.error) throw result.error;

if(mode==='signup' && !result.data.session){
alert('Η εγγραφή έγινε! Έλεγξε το email σου για επιβεβαίωση και μετά συνδέσου.');
authMode('login');
}else{
await loadUserData();
}
}catch(e){
alert('Σφάλμα: '+e.message);
}finally{
$('authButton').disabled=false;
$('authButton').textContent=
$('authButton').dataset.mode==='signup'
?'Δημιουργία λογαριασμού':'Σύνδεση';
}
}

async function forgotPassword(){
const email=$('authEmail').value.trim();

if(!email){
alert('Συμπλήρωσε πρώτα το email σου.');
return;
}

const {error}=await db.auth.resetPasswordForEmail(email,{
redirectTo:'https://savvyexproject.github.io/SAVVYEX/'
});

if(error) alert(error.message);
else alert('Σου στείλαμε email για επαναφορά κωδικού.');
}

async function logout(){
await db.auth.signOut();
user=null;
data={income:[],expenses:[],subscriptions:[],goals:[]};
showAuth();
}

/* =================================
   CLOUD DATABASE
================================= */

async function loadUserData(){
if(!user) return;

loading=true;

try{
const [transactions,subs,goals]=await Promise.all([

db.from('transactions')
.select('*')
.eq('user_id',user.id),

db.from('subscriptions')
.select('*')
.eq('user_id',user.id),

db.from('goals')
.select('*')
.eq('user_id',user.id)

]);

if(transactions.error) throw transactions.error;
if(subs.error) throw subs.error;
if(goals.error) throw goals.error;

data.income=transactions.data
.filter(x=>x.type==='income')
.map(x=>({
id:x.id,title:x.title,amount:Number(x.amount),
category:x.category,date:x.transaction_date
}));

data.expenses=transactions.data
.filter(x=>x.type==='expense')
.map(x=>({
id:x.id,title:x.title,amount:Number(x.amount),
category:x.category,date:x.transaction_date
}));

data.subscriptions=subs.data.map(x=>({
id:x.id,title:x.title,amount:Number(x.amount),
cycle:x.billing_cycle==='yearly'?'Ετήσια':'Μηνιαία'
}));

data.goals=goals.data.map(x=>({
id:x.id,title:x.title,
target:Number(x.target_amount),
saved:Number(x.saved_amount)
}));

render();
}catch(e){
alert('Δεν ήταν δυνατή η φόρτωση των δεδομένων: '+e.message);
}finally{
loading=false;
}
}

async function saveTransaction(item,type){
const {error}=await db.from('transactions').upsert({
id:item.id,
user_id:user.id,
type,
title:item.title,
category:item.category,
amount:item.amount,
transaction_date:new Date().toISOString().slice(0,10)
});

if(error) throw error;
}

async function saveSubscription(item){
const {error}=await db.from('subscriptions').upsert({
id:item.id,
user_id:user.id,
title:item.title,
amount:item.amount,
billing_cycle:item.cycle==='Ετήσια'?'yearly':'monthly'
});

if(error) throw error;
}

async function saveGoal(item){
const {error}=await db.from('goals').upsert({
id:item.id,
user_id:user.id,
title:item.title,
target_amount:item.target,
saved_amount:item.saved
});

if(error) throw error;
}

/* =================================
   APPLICATION DISPLAY
================================= */

function render(){
if(!user) return;

$('appHeader').classList.remove('hidden');
$('nav').classList.remove('hidden');
$('aiFab').classList.toggle('hidden',tab==='ai');

$('nav').querySelectorAll('button').forEach(b=>
b.classList.toggle('active',b.dataset.tab===tab)
);

const inc=sum(data.income);
const exp=sum(data.expenses);
const subs=sum(data.subscriptions);

if(tab==='home'){
header('Τα οικονομικά σου.','Μια πιο καθαρή εικόνα, κάθε μέρα.');

$('app').innerHTML=`
<div class="hero">
<div class="eyebrow">ΠΡΟΣΩΠΙΚΟ ΥΠΟΛΟΙΠΟ</div>
<div class="heroVal">${money(inc-exp)}</div>
<div class="stats">
<div><small>Έσοδα</small><b>${money(inc)}</b></div>
<div><small>Έξοδα</small><b>${money(exp)}</b></div>
</div>
</div>

${card(`
<div class="item">Καλώς ήρθες στη SAVVYEX</div>
<div class="meta">${esc(user.email)}</div>
`)}

<div class="section"><h2>Πρόσφατες κινήσεις</h2></div>

${card([
...data.income.map(x=>({...x,type:'income'})),
...data.expenses.map(x=>({...x,type:'expense'}))
].slice(0,6).map(x=>row(x,x.type)).join('')
||'<div class="empty">Δεν υπάρχουν κινήσεις ακόμη.</div>')}

<div class="section"><h2>Συνδρομές</h2></div>
${card(`
<div class="item">Συνολικό ποσό</div>
<div class="big">${money(subs)}</div>
<div class="meta">${data.subscriptions.length} συνδρομές</div>
`)}
<div class="disclaimer">Τα στοιχεία σου αποθηκεύονται στον προσωπικό σου λογαριασμό SAVVYEX.</div>
`;

}else if(tab==='moves'){

header('Κινήσεις','Τα προσωπικά σου έσοδα και έξοδα.');

$('app').innerHTML=`
${card(`
<div class="eyebrow">ΝΕΑ ΚΑΤΑΧΩΡΗΣΗ</div>
<div class="pills">
<button class="pill active" onclick="setKind('expense')">Έξοδο</button>
<button class="pill" onclick="setKind('income')">Έσοδο</button>
</div>
<input id="moveTitle" placeholder="Περιγραφή">
<input id="moveAmount" inputmode="decimal" placeholder="Ποσό (€)">
<div class="pills">
${(kind==='income'
?['Εργασία','Επιχείρηση','Επένδυση','Άλλο']
:['Τρόφιμα','Λογαριασμοί','Μεταφορές','Καθημερινά','Υγεία','Άλλο']
).map(c=>`<button class="pill ${category===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
</div>
<button class="primary" onclick="addMove()">Αποθήκευση</button>
`)}

<div class="section"><h2>Έξοδα</h2></div>
${card(data.expenses.map(x=>row(x,'expense')).join('')||'<div class="empty">Δεν υπάρχουν έξοδα.</div>')}

<div class="section"><h2>Έσοδα</h2></div>
${card(data.income.map(x=>row(x,'income')).join('')||'<div class="empty">Δεν υπάρχουν έσοδα.</div>')}
`;

}else if(tab==='subs'){

header('Συνδρομές','Παρακολούθησε τις επαναλαμβανόμενες χρεώσεις.');

$('app').innerHTML=`
<div class="hero">
<div class="eyebrow">ΣΥΝΟΛΟ ΣΥΝΔΡΟΜΩΝ</div>
<div class="heroVal">${money(subs)}</div>
</div>

${card(`
<div class="eyebrow">ΝΕΑ ΣΥΝΔΡΟΜΗ</div>
<input id="subTitle" placeholder="Όνομα συνδρομής">
<input id="subAmount" inputmode="decimal" placeholder="Ποσό (€)">
<select id="subCycle">
<option>Μηνιαία</option>
<option>Ετήσια</option>
</select>
<button class="primary" onclick="addSub()">Προσθήκη</button>
`)}

${card(data.subscriptions.map(x=>row({
...x,category:x.cycle
},'expense')).join('')||'<div class="empty">Δεν υπάρχουν συνδρομές.</div>')}
`;

}else if(tab==='goals'){

header('Στόχοι','Οργάνωσε την αποταμίευσή σου.');

$('app').innerHTML=`
${card(`
<div class="eyebrow">ΝΕΟΣ ΣΤΟΧΟΣ</div>
<input id="goalTitle" placeholder="Όνομα στόχου">
<input id="goalTarget" inputmode="decimal" placeholder="Ποσό στόχου (€)">
<button class="primary" onclick="addGoal()">Δημιουργία στόχου</button>
`)}

${data.goals.map(g=>card(`
<div class="item">${esc(g.title)}</div>
<div class="big">${Math.round(g.saved/g.target*100)}%</div>
<div class="progress">
<div class="fill" style="width:${Math.min(100,g.saved/g.target*100)}%"></div>
</div>
<div class="meta">${money(g.saved)} από ${money(g.target)}</div>
<button class="secondary" onclick="progressGoal('${g.id}')">＋ Προσθήκη 20 €</button>
`)).join('')||'<div class="empty">Δεν υπάρχουν στόχοι ακόμη.</div>'}
`;

}else if(tab==='ai'){

header('AI Assistant','Ο προσωπικός σου βοηθός.');

$('app').innerHTML=`
<div class="notice">
Ο AI Assistant είναι δοκιμαστική λειτουργία. Δεν είναι ακόμη συνδεδεμένος με πραγματική υπηρεσία AI.
</div>
${card(chatMessages.map(m=>
`<div class="row"><div class="item">${esc(m.text)}</div></div>`
).join(''))}
${card(`
<input id="chatInput" placeholder="Γράψε την ερώτησή σου">
<button class="primary" onclick="sendChat()">Αποστολή</button>
`)}
`;

}else{

header('Το προφίλ σου','Οι ρυθμίσεις του λογαριασμού σου.');

$('app').innerHTML=`
${card(`
<div class="center">
<div class="avatar" style="margin:auto;width:60px;height:60px">
<img src="./icon.png" alt="SAVVYEX">
</div>
<h3>SAVVYEX</h3>
<div class="meta">${esc(user.email)}</div>
</div>
`)}

${card(`
<div class="item">Προσωπικός λογαριασμός</div>
<div class="meta">Τα δεδομένα σου αποθηκεύονται online και συνδέονται με τον λογαριασμό σου.</div>
<button class="primary danger" onclick="logout()">Αποσύνδεση</button>
`)}

<div class="disclaimer">
Μην καταχωρείς τραπεζικούς κωδικούς ή στοιχεία καρτών.
</div>
`;
}
}

function row(x,type){
return `
<div class="row">
<div class="rowmain">
<div class="item">${esc(x.title)}</div>
<div class="meta">${esc(x.category||x.cycle||'')}</div>
</div>
<div class="amt ${type==='income'?'positive':'negative'}">
${type==='income'?'+':'−'}${money(x.amount)}
</div>
</div>`;
}

/* =================================
   DATA OPERATIONS
================================= */

function val(id){
return $(id)?.value?.trim()||'';
}

function num(id){
return Number(val(id).replace(',','.'));
}

function valid(title,amount){
if(!title||!Number.isFinite(amount)||amount<=0){
alert('Συμπλήρωσε περιγραφή και έγκυρο ποσό.');
return false;
}
return true;
}

window.setKind=function(k){
kind=k;
category=k==='income'?'Εργασία':'Τρόφιμα';
render();
};

window.setCat=function(c){
category=c;
render();
};

window.addMove=async function(){
const title=val('moveTitle');
const amount=num('moveAmount');
if(!valid(title,amount))return;

const item={
id:crypto.randomUUID(),
title,amount,category
};

try{
await saveTransaction(item,kind);
data[kind==='income'?'income':'expenses'].unshift(item);
render();
}catch(e){alert('Δεν αποθηκεύτηκε: '+e.message)}
};

window.addSub=async function(){
const title=val('subTitle');
const amount=num('subAmount');
if(!valid(title,amount))return;

const item={
id:crypto.randomUUID(),title,amount,
cycle:$('subCycle').value
};

try{
await saveSubscription(item);
data.subscriptions.unshift(item);
render();
}catch(e){alert('Δεν αποθηκεύτηκε: '+e.message)}
};

window.addGoal=async function(){
const title=val('goalTitle');
const target=num('goalTarget');
if(!valid(title,target))return;

const item={
id:crypto.randomUUID(),title,
target,saved:0
};

try{
await saveGoal(item);
data.goals.unshift(item);
render();
}catch(e){alert('Δεν αποθηκεύτηκε: '+e.message)}
};

window.progressGoal=async function(id){
const g=data.goals.find(x=>x.id===id);
if(!g)return;

const previous=g.saved;
g.saved=Math.min(g.target,g.saved+20);

try{
await saveGoal(g);
render();
}catch(e){
g.saved=previous;
alert('Δεν αποθηκεύτηκε: '+e.message);
}
};

});
render();
};
